esp32_hosted:
  variant: ESP32C6
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  active_high: true
  use_psram: true
  slot: 1

i2c:
  - id: bsp_bus
    sda: GPIO07
    scl: GPIO08
    frequency: 400kHz 

esp_ldo:
  - voltage: 2.5V
    channel: 3
  - voltage: 2.5V
    channel: 4  
    
output:
  - platform: ledc
    pin: GPIO32
    id: backlight_pwm
    frequency: 1000Hz
    inverted: true

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: backlight
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 250ms
# =============================================================================
# I2S AUDIO CONFIGURATION (ES7210 + ES8311)
# =============================================================================
i2s_audio:
  - id: audio_bus
    i2s_mclk_pin: GPIO13
    i2s_lrclk_pin: GPIO10
    i2s_bclk_pin: GPIO12

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: bsp_bus
    address: 0x18

audio_adc:
  - platform: es7210
    id: es7210_adc
    i2c_id: bsp_bus
    address: 0x40

microphone:
  - platform: i2s_audio
    id: esp32_microphone
    i2s_audio_id: audio_bus
    i2s_din_pin: GPIO11
    sample_rate: 16000
    bits_per_sample: 16bit
    adc_type: external

speaker:
  - platform: i2s_audio
    id: esp32_speaker
    i2s_audio_id: audio_bus
    i2s_dout_pin: GPIO9
    audio_dac: es8311_dac
    dac_type: external
    channel: mono
    buffer_duration: 500ms
    bits_per_sample: 16bit
    sample_rate: 48000

  - platform: mixer
    id: mixing_speaker
    output_speaker: esp32_speaker
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never

  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input
    sample_rate: 48000
    bits_per_sample: 16



media_player:
  - platform: speaker
    name: "ESP32 P4 Media Player"
    id: speaker_media_player
    volume_min: 0.5
    volume_max: 0.75
    volume_increment: 0.05
    announcement_pipeline:
      speaker: announcement_resampling_speaker
      format: FLAC
      sample_rate: 48000
      num_channels: 1
    media_pipeline:
      speaker: media_resampling_speaker
      format: FLAC
      num_channels: 1
      sample_rate: 48000
    on_announcement:
      - if:
          condition:
            - microphone.is_capturing:
          then:
            - micro_wake_word.stop
            - voice_assistant.stop
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 20
          duration: 0.0s
      - switch.turn_on: audio_amplifier
      - delay: 100ms
    on_state:
      if:
        condition:
          and:
            - not:
                voice_assistant.is_running:
            - not:
                media_player.is_announcing:
        then:
          - mixer_speaker.apply_ducking:
              id: media_mixing_input
              decibel_reduction: 0
              duration: 1.0s
    on_play:
      - logger.log: "Media player started playing, disabling microphone"
      - switch.turn_on: audio_amplifier
      - delay: 100ms
      - micro_wake_word.stop
      - voice_assistant.stop
    on_idle:
      - delay: 100ms
      - switch.turn_off: audio_amplifier
      - if:
          condition:
            not:
              voice_assistant.is_running:
          then:
            - micro_wake_word.start



micro_wake_word:
  id: mww
  models:
    - okay_nabu
#    - hey_mycroft
#    - hey_jarvis
  on_wake_word_detected:
    - component.update: main_display
    # Le mot d'éveil amène le visage à l'écran et le réveille.
    - lvgl.page.show:
        id: page_face
        animation: MOVE_LEFT
        time: 250ms
    - lvgl_kawaii_face.set_emotion:
        id: face
        emotion: excited
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

voice_assistant:
  microphone: esp32_microphone
  media_player: speaker_media_player
  micro_wake_word: mww
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  conversation_timeout: 300s

  on_start:
    - component.update: main_display

  on_listening:
    - component.update: main_display
    - lvgl_kawaii_face.set_emotion:
        id: face
        emotion: listening

  on_stt_end:
    - component.update: main_display
    - lvgl_kawaii_face.set_emotion:
        id: face
        emotion: thinking

  # `x` = le texte prononcé : le visage suit le CONTENU de la réponse.
  on_tts_start:
    - component.update: main_display
    - lvgl_kawaii_face.set_emotion_from_text:
        id: face
        text: !lambda return x;

  on_tts_end:
    - component.update: main_display


  # --- End of flow → idle ---
  on_end:
    - wait_until:
        condition:
          - media_player.is_announcing:
        timeout: 0.5s
    - wait_until:
        - and:
            - not:
                media_player.is_announcing:
            - not:
                media_player.is_playing:
    - component.update: main_display
    - lvgl_kawaii_face.set_emotion:
        id: face
        emotion: neutral

    - micro_wake_word.start:

  on_error:
    - component.update: main_display
    - lvgl_kawaii_face.set_emotion:
        id: face
        emotion: error


  on_client_connected:
    - micro_wake_word.start:
  on_client_disconnected:
    - micro_wake_word.stop:

switch:


  - platform: gpio
    pin: GPIO53 
    name: "Audio Amplifier"
    id: audio_amplifier
    restore_mode: ALWAYS_OFF 


touchscreen:
  - platform: gt911
    id: touch
    i2c_id: bsp_bus
    reset_pin: GPIO23
    update_interval: 8ms   # polling (pas d'interruption)
    on_touch:
      - lambda: |-
          ESP_LOGD("touchscreen", "Touch detected at (%d, %d)", touch.x, touch.y);
      - light.turn_on: backlight 
               
    transform:
      swap_xy: false
      mirror_x: true
      mirror_y: true   
    
display:
  - platform: mipi_dsi
    id: main_display
    show_test_card: false
    model: CUSTOM
    update_interval: never
    auto_clear_enabled: false
    hsync_back_porch: 160
    lane_bit_rate: 1000Mbps
    color_order: rgb
    lanes: 2
    reset_pin:
      number: 33
    hsync_pulse_width: 70
    hsync_front_porch: 160
    vsync_back_porch: 23
    vsync_pulse_width: 1
    vsync_front_porch: 12
    pclk_frequency: 51MHz 
    dimensions:
      width: 1024
      height: 600     
    init_sequence:   
      - [0xB2, 0x10]
      - [0x80, 0x8B]
      - [0x81, 0x78]
      - [0x82, 0x84]
      - [0x83, 0x88]
      - [0x84, 0xA8]
      - [0x85, 0xE3]
      - [0x86, 0x88]
      - [0x11, 0x00]
      - delay 120ms
      - [0x29]

lvgl:
  use_ppa: true
  use_ppa_img: true
  color_depth: 16
  buffer_size: 100%
  byte_order: little_endian
  fps_benchmark: true
  perf_monitor: true
  rotation: 180

  # Deux pages, et le visage est sur la DEUXIÈME : c'est exactement le cas qui
  # ne marchait pas (le visage se créait toujours sur la page affichée au
  # démarrage). Au boot on doit voir « Page 1 », pas le visage.
  pages:
    - id: page_home
      bg_color: ${background_color}
      widgets:
        - label:
            id: home_title
            text: "Page 1 - accueil"
            text_color: ${text_color}
            text_font: montserrat_38
            align: TOP_MID
            y: 60

        - label:
            id: home_hint
            text: "Le visage est sur la page 2 (dis « okay nabu » ou appuie ci-dessous)"
            text_color: ${text_color_secondary}
            text_font: montserrat_20
            align: TOP_MID
            y: 130

        - button:
            id: btn_show_face
            width: 320
            height: 90
            align: CENTER
            bg_color: 0x1F6FEB
            radius: 45
            widgets:
              - label:
                  text: "Voir le visage"
                  text_color: 0xFFFFFF
                  text_font: montserrat_28
                  align: CENTER
            on_click:
              - lvgl.page.show:
                  id: page_face
                  animation: MOVE_LEFT
                  time: 250ms

    - id: page_face
      bg_color: ${background_color}
      widgets:
        # Le conteneur du visage. Sa taille définit celle du visage : le
        # composant s'adapte tout seul (min(width, height)).
        #
        # Il a un fond OPAQUE clair : les canvas des yeux et de la bouche sont
        # opaques, le composant reprend automatiquement la couleur du premier
        # parent opaque comme « peau ». Sur un fond noir les sourcils (brun
        # foncé) et le contour des yeux (noir) disparaîtraient — d'où cette
        # plaque claire. Pour un visage sur fond noir : bg_opa: TRANSP ici.
        - obj:
            id: face_panel
            width: 520
            height: 520
            align: CENTER
            y: -20
            bg_color: 0xF7F0E8
            bg_opa: COVER
            radius: 60
            border_width: 0
            pad_all: 0

        - button:
            id: btn_back_home
            width: 200
            height: 70
            align: BOTTOM_MID
            y: -20
            bg_color: 0x30363D
            radius: 35
            widgets:
              - label:
                  text: "Retour"
                  text_color: 0xFFFFFF
                  text_font: montserrat_22
                  align: CENTER
            on_click:
              - lvgl.page.show:
                  id: page_home
                  animation: MOVE_RIGHT
                  time: 250ms

# =============================================================================
# LE VISAGE KAWAII
# =============================================================================
# parent_id accepte l'id d'un widget (ici face_panel) ou directement l'id d'une
# page. Le visage est créé DANS ce widget — plus jamais sur la page affichée au
# démarrage.
lvgl_kawaii_face:
  id: face
  parent_id: face_panel
  initial_emotion: neutral
  animation_speed: 30ms
  blink_interval: 3000ms
  auto_blink: true
  smooth: true
  response_fallback: speaking
  # Optionnel : la couleur est déduite du fond de la page si on l'omet.
  # bg_color: ${background_color}
