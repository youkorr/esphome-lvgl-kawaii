lvgl:
  use_ppa: true
  use_ppa_img: true
  color_depth: 16
  buffer_size: 100%
  byte_order: little_endian
  fps_benchmark: true
  perf_monitor: true
  rotation: 180

  # Deux pages, et le visage est sur la DEUXIÈME : c'est exactement le cas qui
  # ne marchait pas (le visage se créait toujours sur la page affichée au
  # démarrage). Au boot on doit voir « Page 1 », pas le visage.
  pages:
    - id: page_home
      bg_color: ${background_color}
      widgets:
        - label:
            id: home_title
            text: "Page 1 - accueil"
            text_color: ${text_color}
            text_font: montserrat_38
            align: TOP_MID
            y: 60

        - label:
            id: home_hint
            text: "Le visage est sur la page 2 (dis « okay nabu » ou appuie ci-dessous)"
            text_color: ${text_color_secondary}
            text_font: montserrat_20
            align: TOP_MID
            y: 130

        - button:
            id: btn_show_face
            width: 320
            height: 90
            align: CENTER
            bg_color: 0x1F6FEB
            radius: 45
            widgets:
              - label:
                  text: "Voir le visage"
                  text_color: 0xFFFFFF
                  text_font: montserrat_28
                  align: CENTER
            on_click:
              - lvgl.page.show:
                  id: page_face
                  animation: MOVE_LEFT
                  time: 250ms

    - id: page_face
      bg_color: ${background_color}
      widgets:
        # Le conteneur du visage. Reprend à l'identique le panneau de
        # l'exemple upstream (0015/lvgl_kawaii_face, examples/basic_cycle) :
        #   set_size / center / bg_opa TRANSP / border_width 0 / pad_all 0
        #   / clear_flag(SCROLLABLE)
        # scrollable: false est indispensable — les canvas des yeux débordent
        # un peu du conteneur, donc sans ça un glissement du doigt sur le
        # visage le ferait défiler.
        #
        # ---> C'EST ICI QU'ON RÈGLE LA TAILLE DU VISAGE. <---
        # Les proportions suivent la taille (référence upstream : 135).
        #
        # Fond transparent : le noir de la page traverse, et le composant
        # reprend cette couleur pour les canvas des yeux/bouche. Le visage se
        # pose donc directement sur l'écran sombre, comme dans le GIF.
        # Le cadre arrondi du GIF de démo (make_demo_gif.py : rounded_rectangle
        # inset 8, radius 26, width 2, couleur 28/35/49 sur un cadre de 300).
        # Transposé ici : radius 36, bord 3, même couleur. Purement décoratif —
        # enlève ce bloc et remets face_panel directement dans la page si tu
        # n'en veux pas.
        #
        # Sa taille compte : dans le GIF les yeux occupent 55 % du cadre, alors
        # que le composant les dessine sur 90 % de face_sz. Le cadre doit donc
        # être nettement plus grand que le visage — ratio ~420/256, mesuré sur
        # le GIF.
        - obj:
            id: face_frame
            width: 420
            height: 420
            align: CENTER
            y: -40
            bg_opa: TRANSP
            border_width: 3
            border_color: 0x1C2331
            radius: 36
            pad_all: 0
            scrollable: false
            widgets:
              # ---> C'EST ICI QU'ON RÈGLE LA TAILLE DU VISAGE. <---
              # Garde ~61 % de la largeur du cadre pour rester fidèle au GIF.
              - obj:
                  id: face_panel
                  width: 256
                  height: 256
                  align: CENTER
                  y: -14
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  scrollable: false

              # Légende de l'émotion, dans le cadre comme dans le GIF.
              - label:
                  id: face_caption
                  text: ""
                  text_color: ${text_color_secondary}
                  text_font: montserrat_22
                  align: BOTTOM_MID
                  y: -18

        - button:
            id: btn_back_home
            width: 200
            height: 70
            align: BOTTOM_LEFT
            x: 40
            y: -20
            bg_color: 0x30363D
            radius: 35
            widgets:
              - label:
                  text: "Retour"
                  text_color: 0xFFFFFF
                  text_font: montserrat_22
                  align: CENTER
            on_click:
              - lvgl.page.show:
                  id: page_home
                  animation: MOVE_RIGHT
                  time: 250ms

        # Fait défiler les 17 expressions pour juger le rendu.
        - button:
            id: btn_demo
            width: 260
            height: 70
            align: BOTTOM_RIGHT
            x: -40
            y: -20
            checkable: true
            bg_color: 0x30363D
            radius: 35
            widgets:
              - label:
                  text: "Démo expressions"
                  text_color: 0xFFFFFF
                  text_font: montserrat_22
                  align: CENTER
            on_click:
              - switch.toggle: face_demo

# =============================================================================
# LE VISAGE KAWAII
# =============================================================================
# parent_id accepte l'id d'un widget (ici face_panel) ou directement l'id d'une
# page. Le visage est créé DANS ce widget — plus jamais sur la page affichée au
# démarrage.
lvgl_kawaii_face:
  id: face
  parent_id: face_panel
  initial_emotion: neutral
  animation_speed: 30ms
  blink_interval: 3000ms
  auto_blink: true
  smooth: true
  response_fallback: speaking
  # Optionnel : la couleur est déduite du fond de la page si on l'omet.
  # bg_color: ${background_color}

# =============================================================================
# VIE AUTONOME — le visage vit même quand on ne lui parle pas
# =============================================================================
# Tempérament « expressif » : une expression toutes les ~10 s sur toute la
# palette. Tout est mis en veille dès qu'une conversation démarre (va_busy),
# pour ne jamais écraser la réaction à l'assistant vocal.
#
# Pour calmer le visage : allonge l'interval, ou réduis la liste IDLE_SET.
# =============================================================================
# RYTHME DE LA JOURNÉE
# =============================================================================
time:
  - platform: homeassistant
    id: ha_time
    on_time:
      - hours: 7
        minutes: 0
        then:
          - lvgl_kawaii_face.set_emotion: { id: face, emotion: happy }
      - hours: 13
        minutes: 0
        then:
          - lvgl_kawaii_face.set_emotion: { id: face, emotion: cool }
      - hours: 22
        minutes: 30
        then:
          - lvgl_kawaii_face.set_emotion: { id: face, emotion: sleepy }
      - hours: 0
        minutes: 0
        then:
          # La nuit, on coupe la vie autonome : le visage dort vraiment.
          - lambda: id(idle_life).stop();
      - hours: 7
        minutes: 1
        then:
          - lambda: id(idle_life).start();

# =============================================================================
# RÉACTIONS À LA MAISON
# =============================================================================
# Remplace les entity_id par les tiens. Chaque bloc est indépendant : supprime
# ceux qui ne te servent pas.
binary_sensor:
  # Quelqu'un entre dans la pièce -> le visage s'illumine
  - platform: homeassistant
    id: ha_presence
    entity_id: binary_sensor.presence_salon   # <-- À ADAPTER
    on_press:
      then:
        - lambda: id(last_interaction) = millis();
        - lvgl_kawaii_face.set_emotion: { id: face, emotion: excited }
        - lvgl.page.show: { id: page_face, animation: MOVE_LEFT, time: 250ms }

  # Porte / sonnette -> surpris
  - platform: homeassistant
    id: ha_doorbell
    entity_id: binary_sensor.sonnette         # <-- À ADAPTER
    on_press:
      then:
        - lvgl_kawaii_face.set_emotion: { id: face, emotion: surprised }

text_sensor:
  # Alarme : armée -> working_hard, déclenchée -> angry
  - platform: homeassistant
    id: ha_alarm
    entity_id: ${alarm_panel_entity}
    on_value:
      then:
        - lvgl_kawaii_face.set_emotion:
            id: face
            emotion: !lambda |-
              if (x == "triggered") return "angry";
              if (x == "armed_away" || x == "armed_night") return "working_hard";
              if (x == "arming" || x == "pending") return "worried";
              return "neutral";

  # Météo : le visage prend le temps qu'il fait
  - platform: homeassistant
    id: ha_weather
    entity_id: ${weather_entity}
    on_value:
      then:
        - lvgl_kawaii_face.set_emotion:
            id: face
            emotion: !lambda |-
              if (x == "sunny" || x == "clear-night") return "cool";
              if (x == "rainy" || x == "pouring") return "sad";
              if (x == "lightning" || x == "lightning-rainy") return "surprised";
              if (x == "snowy") return "excited";
              return "neutral";
