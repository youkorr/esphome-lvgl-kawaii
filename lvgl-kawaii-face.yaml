# =============================================================================
# I2S AUDIO CONFIGURATION (ES7210 + ES8311)
# =============================================================================
i2s_audio:
  - id: audio_bus
    i2s_mclk_pin: GPIO13
    i2s_lrclk_pin: GPIO10
    i2s_bclk_pin: GPIO12

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: bsp_bus
    address: 0x18

audio_adc:
  - platform: es7210
    id: es7210_adc
    i2c_id: bsp_bus
    address: 0x40

microphone:
  - platform: i2s_audio
    id: esp32_microphone
    i2s_audio_id: audio_bus
    i2s_din_pin: GPIO11
    sample_rate: 16000
    bits_per_sample: 16bit
    adc_type: external

speaker:
  - platform: i2s_audio
    id: esp32_speaker
    i2s_audio_id: audio_bus
    i2s_dout_pin: GPIO9
    audio_dac: es8311_dac
    dac_type: external
    channel: mono
    buffer_duration: 500ms
    bits_per_sample: 16bit
    sample_rate: 48000

  - platform: mixer
    id: mixing_speaker
    output_speaker: esp32_speaker
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never

  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input
    sample_rate: 48000
    bits_per_sample: 16



media_player:
  - platform: speaker
    name: "ESP32 P4 Media Player"
    id: speaker_media_player
    volume_min: 0.5
    volume_max: 0.75
    volume_increment: 0.05
    announcement_pipeline:
      speaker: announcement_resampling_speaker
      format: FLAC
      sample_rate: 48000
      num_channels: 1
    media_pipeline:
      speaker: media_resampling_speaker
      format: FLAC
      num_channels: 1
      sample_rate: 48000
    on_announcement:
      - if:
          condition:
            - microphone.is_capturing:
          then:
            - micro_wake_word.stop
            - voice_assistant.stop
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 20
          duration: 0.0s
      - switch.turn_on: audio_amplifier
      - delay: 100ms
    on_state:
      if:
        condition:
          and:
            - not:
                voice_assistant.is_running:
            - not:
                media_player.is_announcing:
        then:
          - mixer_speaker.apply_ducking:
              id: media_mixing_input
              decibel_reduction: 0
              duration: 1.0s
    on_play:
      - logger.log: "Media player started playing, disabling microphone"
      - switch.turn_on: audio_amplifier
      - delay: 100ms
      - micro_wake_word.stop
      - voice_assistant.stop
    on_idle:
      - delay: 100ms
      - switch.turn_off: audio_amplifier
      - if:
          condition:
            not:
              voice_assistant.is_running:
          then:
            - micro_wake_word.start



micro_wake_word:
  id: mww
  models:
    - okay_nabu
#    - hey_mycroft
#    - hey_jarvis
  on_wake_word_detected:
    - component.update: main_display
    # Le mot d'éveil amène le visage à l'écran et le réveille.
    - lvgl.page.show:
        id: page_face
        animation: MOVE_LEFT
        time: 250ms
    - lvgl_kawaii_face.set_emotion:
        id: face
        emotion: excited
    - lambda: id(va_busy) = true;
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

voice_assistant:
  microphone: esp32_microphone
  media_player: speaker_media_player
  micro_wake_word: mww
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  conversation_timeout: 300s

  on_start:
    - component.update: main_display

  on_listening:
    - component.update: main_display
    - lvgl_kawaii_face.set_emotion:
        id: face
        emotion: listening

  on_stt_end:
    - component.update: main_display
    - lvgl_kawaii_face.set_emotion:
        id: face
        emotion: thinking

  # `x` = le texte prononcé : le visage suit le CONTENU de la réponse,
  # et la bouche s'anime tant qu'il parle.
  on_tts_start:
    - component.update: main_display
    - lvgl_kawaii_face.set_emotion_from_text:
        id: face
        text: !lambda return x;
    - lvgl_kawaii_face.set_talking: true

  on_tts_end:
    - component.update: main_display
    - lvgl_kawaii_face.set_talking: false


  # --- End of flow → idle ---
  on_end:
    - wait_until:
        condition:
          - media_player.is_announcing:
        timeout: 0.5s
    - wait_until:
        - and:
            - not:
                media_player.is_announcing:
            - not:
                media_player.is_playing:
    - component.update: main_display
    - lvgl_kawaii_face.set_emotion:
        id: face
        emotion: neutral
    - lvgl_kawaii_face.set_talking: false
    - lambda: |-
        id(va_busy) = false;
        id(last_interaction) = millis();

    - micro_wake_word.start:

  on_error:
    - component.update: main_display
    - lvgl_kawaii_face.set_talking: false
    - lvgl_kawaii_face.set_emotion:
        id: face
        emotion: error
    - lambda: id(va_busy) = false;


  on_client_connected:
    - micro_wake_word.start:
  on_client_disconnected:
    - micro_wake_word.stop:

globals:
  # Index courant dans la liste des 17 expressions (démo).
  - id: demo_emotion_idx
    type: int
    restore_value: false
    initial_value: '0'
  - id: demo_emotion_name
    type: std::string
    restore_value: false
  # Vrai pendant toute une conversation : la vie autonome se tait alors.
  - id: va_busy
    type: bool
    restore_value: false
    initial_value: 'false'
  # Horodatage de la dernière sollicitation, pour l'endormissement.
  - id: last_interaction
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: idle_emotion
    type: std::string
    restore_value: false

switch:


  - platform: gpio
    pin: GPIO53
    name: "Audio Amplifier"
    id: audio_amplifier
    restore_mode: ALWAYS_OFF

  # Fait défiler les 17 expressions, comme examples/basic_cycle du dépôt
  # d'origine. Sert à juger le rendu sans déclencher l'assistant vocal.
  # Coupe-le pour laisser le voice assistant piloter le visage.
  - platform: template
    name: "Démo expressions du visage"
    id: face_demo
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_off_action:
      - lvgl.label.update:
          id: face_caption
          text: ""

interval:
  # 2500 ms = HOLD_MS de l'exemple upstream.
  - interval: 2500ms
    then:
      - if:
          condition:
            switch.is_on: face_demo
          then:
            - lambda: |-
                // Même ordre que ALL_EMOTIONS[] dans examples/basic_cycle/main/main.c
                static const char *const EMOTIONS[] = {
                    "neutral", "happy", "worried", "wink", "love", "surprised",
                    "playful", "silly", "smirk", "working_hard", "excited",
                    "confused", "cool", "sleepy", "sad", "cry", "angry"};
                const int count = sizeof(EMOTIONS) / sizeof(EMOTIONS[0]);
                int i = id(demo_emotion_idx);
                id(demo_emotion_name) = EMOTIONS[i];
                id(demo_emotion_idx) = (i + 1) % count;
            - lvgl_kawaii_face.set_emotion:
                id: face
                emotion: !lambda return id(demo_emotion_name);
            - lvgl.label.update:
                id: face_caption
                text: !lambda return id(demo_emotion_name);

  - interval: 10s
    id: idle_life
    then:
      - if:
          condition:
            - lambda: 'return !id(va_busy) && !id(face_demo).state;'
          then:
            - lambda: |-
                // Palette complète (tempérament expressif). Retire des entrées
                // pour un visage plus discret.
                static const char *const IDLE_SET[] = {
                    "neutral", "happy", "cool", "smirk", "worried", "confused",
                    "silly", "playful", "excited", "wink", "sleepy"};
                const int n = sizeof(IDLE_SET) / sizeof(IDLE_SET[0]);

                // Endormissement : après 5 min sans sollicitation, le visage
                // pique du nez au lieu de continuer à s'agiter.
                uint32_t idle_ms = millis() - id(last_interaction);
                if (idle_ms > 300000) {
                  id(idle_emotion) = "sleepy";
                  return;
                }

                // Tirage sans répétition immédiate.
                static int prev = -1;
                int i = random_uint32() % n;
                if (i == prev) i = (i + 1) % n;
                prev = i;
                id(idle_emotion) = IDLE_SET[i];
            - lvgl_kawaii_face.set_emotion:
                id: face
                emotion: !lambda return id(idle_emotion);

  # Regard vagabond : les yeux balaient la pièce entre deux expressions.
  - interval: 2500ms
    then:
      - if:
          condition:
            - lambda: 'return !id(va_busy) && !id(face_demo).state;'
          then:
            - lvgl_kawaii_face.look_at:
                id: face
                x: !lambda 'return (int) (random_uint32() % 161) - 80;'
                y: !lambda 'return (int) (random_uint32() % 81) - 40;'
                hold: 2s



